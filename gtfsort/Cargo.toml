[package]
name = "gtfsort"
version = "0.2.3"
authors = { workspace = true }
edition = "2021"
license = { workspace = true }
description = { workspace = true }
homepage = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
keywords = ["sort", "gtf", "gff", "gtfsort"]
categories = ["command-line-utilities", "science"]
default-run = "gtfsort"

[dependencies]
clap = { workspace = true, features = ["derive"] }
colored = {version = "1.9.4"}
natord = "1.0.9"
indoc = "2.0.4"
thiserror = { workspace = true }
simple_logger = "4.0.0"
rayon = "1.8.0"
num_cpus = "1.16.0"
log = { workspace = true }
hashbrown = {version="0.14", features=["rayon"]}
dashmap = { workspace = true }
time = "0.3.36"
libR-sys = { version = "0.7.0", optional = true }
reqwest = { version = "0.12.5", features = ["blocking"], optional = true }
crc = { version = "3.2.1", optional = true}
flate2 = { version ="1.0.30" , optional = true}
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
itertools = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["Win32", "Win32_System", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Memory", "Win32_Security"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = ["mmap", "c_ffi"]
testing = ["dep:reqwest", "dep:crc", "dep:flate2"]
benchmark = ["testing", "dep:serde", "dep:serde_json"]
mmap = []
c_ffi = []
all_ffi = ["c_ffi"]
serde = ["dep:serde"]
serde_json = ["dep:serde_json"]

[lib]
name = "gtfsort"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gtfsort"
path = "src/main.rs"

[[bin]]
name = "gtfsort-benchmark"
path = "ci/benchmark.rs"
required-features = ["mmap", "benchmark"]

[[test]]
name = "integration_test"
path = "ci/integration_test.rs"
required-features = ["testing"]

[build-dependencies]
cbindgen = "0.26.0"
