[workspace]
resolver = "2"
members = [
    "gtfsort",
    "py-gtfsort",
    "web/gtfsort-webui/gtfsort"
]

[workspace.package]
authors = ["alejandrogzi <alejandrxgzi@gmail.com>", "eternal-flame-AD <yume@yumechi.jp>"]
license = "MIT"
repository = "https://github.com/alejandrogzi/gtfsort"
homepage = "https://github.com/alejandrogzi/gtfsort"
description = "An optimized chr/pos/feature GTF/GFF sorter using a lexicographic-based index ordering algorithm written in Rust."
readme = "README.md"

[workspace.dependencies]
gtfsort = { path = "gtfsort", default-features = false }

thiserror = "1.0"
serde = "1.0.204"
serde_json = "1.0.122"
log = "0.4.14"

clap = "4.0"
libc = "0.2.151"
num_cpus = "1.16.0"
dashmap = "5.5"
itertools = "0.13.0"

vergen = { version = "9.0.0", features = ["build", "cargo"] }
vergen-git2 = { version = "1.0.0", features = ["build"] }

[profile.release]
opt-level = 3
lto = true

[profile.release.package.gtfsort-web]
opt-level = "s"
